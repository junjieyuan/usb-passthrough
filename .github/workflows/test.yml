name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python3 -m py_compile usb-passthrough-daemon.py test_replay.py
      - name: Replay test (self-contained, no pyudev/libvirt needed)
        run: python3 test_replay.py
